# hypridle — kanonik idle yapılandırması (Hyprland 0.55 Lua dispatch sözdizimi).
# Donma sorunu yok: hyprland.lua misc:{mouse_move,key_press}_enables_dpms=true +
# kernel amdgpu.dcdebugmask=0xc10 (PSR/Replay/IPS kapalı). Gerçek DPMS, input ile uyanır.
#
# NOT: 0.55'te `hyprctl dispatch dpms off` ÖLÜ — argüman artık Lua olarak yorumlanır.
# Kanonik biçim: hyprctl dispatch 'hl.dsp.dpms({ action = "disable"/"enable" })'.
#
# Medya oynarken ekran KAPANMAZ: ignore_dbus_inhibit varsayılan (false), oynatıcı
# ses çalarken idle inhibitor'ı tutar — kanonik, doğru davranış.

general {
    before_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'  # uyumadan önce ekranı kapat
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'    # uyanınca ekranı garanti aç
}

# 4 dk: parlaklığı kaydet + %10'a düşür (ekran kapanmak üzere uyarısı); harekette geri yükle
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 dk: gerçek DPMS off (OLED tamamen söner → burn-in yok); input ile anında uyanır
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 30 dk: suspend (RAM'e uyku) → bırakıp gidince şarj boşalmaz. Medya/inhibitor varken
# tetiklenmez (ignore_dbus_inhibit=false). Uzun işte (indirme vb.) engellemek için:
# systemd-inhibit --what=idle <komut>. Kapak/tuş ile uyanır.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
