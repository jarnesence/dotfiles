[Resolve]
# Tüm sorgular global DNS'e gider (dnscrypt); Wi-Fi/modem DNS'i yalnız yerel .lan adları için.
# Bu olmadan resolved sorguyu modem DNS'ine de yolluyordu → operatörün engel cevabı kazanıyordu.
DNS=127.0.0.1 1.1.1.1 9.9.9.9
Domains=~.
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com
DNSOverTLS=no
DNSSEC=no
Cache=yes
DNSStubListener=yes
