[Resolve]
# WARP kapalıyken şifreli DNS: dnscrypt-proxy (Mullvad DoH, 127.0.0.1:53)
DNS=127.0.0.1
# ikisi de ölürse doğrudan Cloudflare
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com
# upstream'ler zaten şifreli; resolved katmanında DoT/DNSSEC açmak kırar
DNSOverTLS=no
DNSSEC=no
Cache=yes
DNSStubListener=yes
